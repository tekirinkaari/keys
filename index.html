<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow,noarchive,nosnippet">
<meta name="referrer" content="no-referrer">
<title>Найдены ключи</title>
<style>
:root{color-scheme:light dark;--bg:#f5f5f7;--card:#fff;--text:#1d1d1f;--muted:#6e6e73;--blue:#007aff;--green:#34c759;--border:rgba(0,0,0,.08)}
@media(prefers-color-scheme:dark){:root{--bg:#000;--card:#1c1c1e;--text:#f5f5f7;--muted:#a1a1a6;--border:rgba(255,255,255,.1)}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}
.card{width:min(100%,520px);padding:30px;border-radius:24px;background:var(--card);border:1px solid var(--border);box-shadow:0 18px 60px rgba(0,0,0,.12);text-align:center}
.icon{font-size:58px;margin-bottom:12px}
h1{margin:0 0 14px;font-size:30px}
p{margin:0 0 20px;font-size:18px;line-height:1.45}
.phone{margin:18px 0 22px;font-size:26px;font-weight:700}
.buttons{display:grid;gap:12px}
.btn{display:block;padding:16px 18px;border-radius:14px;color:#fff;text-decoration:none;font-size:18px;font-weight:650}
.call{background:var(--green)} .sms{background:var(--blue)}
.note{margin-top:22px;font-size:13px;line-height:1.4;color:var(--muted)}
.error{color:#ff3b30;font-size:17px;line-height:1.45}
[hidden]{display:none!important}
</style>
</head>
<body>
<main class="card">
<div class="icon">🔑</div>
<h1>Вы нашли мои ключи</h1>

<div id="content" hidden>
<p>Спасибо, что нашли их. Пожалуйста, свяжитесь со мной. За возврат предусмотрено небольшое вознаграждение.</p>
<div id="phone" class="phone"></div>
<div class="buttons">
<a id="call" class="btn call" href="#">📞 Позвонить владельцу</a>
<a id="sms" class="btn sms" href="#">💬 Написать SMS</a>
</div>
<div class="note">Контактные данные открываются только по полной NFC-ссылке.</div>
</div>

<div id="error" class="error">
Контактная информация недоступна.<br>
Откройте страницу по ссылке с NFC-метки.
</div>
</main>

<script>
const NONCE="s98eSOUqEkb6dEw2";
const CIPHERTEXT="pQlVOA_LdOXt4xER6lgRcvIZinUhrjxnyzJ4rpMIj5iqrZB4XprzIw";

const fromB64url=s=>{
  s=s.replace(/-/g,"+").replace(/_/g,"/");
  while(s.length%4)s+="=";
  return Uint8Array.from(atob(s),c=>c.charCodeAt(0));
};

(async()=>{
  try{
    const secret=location.hash.startsWith("#k=")?location.hash.slice(3):"";
    if(!secret)throw new Error("missing key");

    const key=await crypto.subtle.importKey(
      "raw",fromB64url(secret),{name:"AES-GCM"},false,["decrypt"]
    );

    const plain=await crypto.subtle.decrypt(
      {name:"AES-GCM",iv:fromB64url(NONCE)},
      key,
      fromB64url(CIPHERTEXT)
    );

    const data=JSON.parse(new TextDecoder().decode(plain));
    document.getElementById("phone").textContent=data.phone;
    document.getElementById("call").href="tel:"+data.phone;
    document.getElementById("sms").href="sms:"+data.phone;
    document.getElementById("error").hidden=true;
    document.getElementById("content").hidden=false;
  }catch(e){}
})();
</script>
</body>
</html>
